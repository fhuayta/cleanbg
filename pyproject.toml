[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleanbg"
version = "0.1.0"
description = "Remove image backgrounds locally and keep the subject."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Franz Huayta Quevedo" },
]
keywords = [
  "background-removal",
  "image-processing",
  "cli",
  "onnx",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "pillow>=10.0.0",
  "rembg[cpu]>=2.0.60",
]

[project.optional-dependencies]
gpu = ["rembg[gpu]>=2.0.60"]
dev = ["pytest>=8.0"]

[project.scripts]
cleanbg = "cleanbg.cli:main"

[project.urls]
Homepage = "https://github.com/fhuayta/cleanbg"
Source = "https://github.com/fhuayta/cleanbg"
Issues = "https://github.com/fhuayta/cleanbg/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cleanbg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
